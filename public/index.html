<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="noHome" content="true">
    <title>Crownana Bread</title>
    <link rel="stylesheet" href="resources/styles.css">
</head>
<body>
    <div class="sticker-bg">
        <img src="/resources/images/goosesps.webp" alt="goose driving an llv" id="hp-goosesps" class="no-a">
        <img src="/resources/images/anne-fall.png" alt="Anne falling" id="hp-anne-fall" class="no-a">
        <img src="/resources/images/marcy%20WRITING.png" alt="Marcy writing" id="hp-marcy-writing" class="no-a">
        <img src="/resources/images/sprig-scream.png" alt="sprig screaming" id="hp-sprig-screaming" class="no-a">
        <img src="/resources/images/caw_no_god.png" alt="crow with knife that says 'where's your god now, mortal"
             id="hp-caw" class="no-a">
        <img src="/resources/images/meow%20meow.png" alt="Luz 'meow meow'" id="hp-meow-meow" class="no-a">
        <img src="/resources/images/wet-owl.png" alt="a wet owl" id="hp-wet-owl" class="no-a">
        <img src="/resources/images/hawk-sitting.png" alt="a hawk sitting" id="hp-hawk-sitting" class="no-a">
        <img src="/resources/images/gliding.png" alt="a raptor gliding" id="hp-gliding" class="no-a">
        <img src="/resources/images/ao3saver.png" alt="ao3saver icon" id="hp-ao3saver" class="no-a">
        <img src="/resources/images/Tulip.webp" alt="tulip olson" id="hp-tulip" class="no-a">
        <img src="/resources/images/Randall.png" alt="Randall" id="hp-randall" class="no-a">
        <img src="/resources/images/One-One_Render.webp" alt="one-one" id="hp-one-one" class="no-a">
        <img src="/resources/images/Glad-One_and_Sad-One.webp" alt="one-one-split" id="hp-one-one-split" class="no-a">
        <img src="/resources/images/Atticus.webp" alt="atticus" id="hp-atticus" class="no-a">
        <img src="/resources/images/Steward.png" alt="infinity train steward" id="hp-steward" class="no-a">
        <img src="/resources/images/The_Cat.webp" alt="infinity train the cat" id="hp-the-cat" class="no-a">
        <img src="/resources/images/canada-goose.png" alt="canada goose" id="hp-canada-goose" class="no-a">
        <img src="/resources/images/goose.png" alt="goose" id="hp-goose" class="no-a">
        <img src="/resources/images/Hilda_Running.webp" alt="hilda" id="hp-hilda" class="no-a">
        <img src="/resources/images/Hilda_thinking.webp" alt="hilda teen" id="hp-hilda-teen" class="no-a">
        <img src="/resources/images/twig.png" alt="twig (deer fox)" id="hp-twig" class="no-a">
        <img src="/resources/images/Alfur.webp" alt="Alfur (elf)" id="hp-alfur" class="no-a">
        <img src="/resources/images/miku.png" alt="Miku" id="hp-miku" class="no-a">
        <img src="/resources/images/love21.png" alt="love 2021 stamp" id="hp-love21" class="no-a">
    </div>


    <div id="autoplay" class="fixed-center">
        <div id="autoplay-content" class="fixed-center">
            <div id="autoplay-header">
                <h1>ATTENTION SURFER OF THE WORLD WIDE WEB!!</h1>
                <img src="/resources/images/goose-rotate.gif" class="no-thumb" alt="3d model of goose rotating" width="240" height="171">
                <h3>To embrace the full effect of this website, you must allow me to play sound</h3>
            </div>
            <div id="autoplay-buttons">
                <div id="accept-sound">
                    <img src="/resources/images/cat_okay.png" alt="cat with thumbs up with text that says okay">
                </div>
                <div id="deny-sound">
                    <img src="/resources/images/cat_no.png" alt="cat with thumbs up with text that says okay">
                </div>
            </div>
        </div>
    </div>

    <svg style="position: fixed">
        <defs>
            <clipPath id="star">
                <path d="M100,0 42,180 196,70 4,70 158,180z"/>
            </clipPath>
        </defs>
    </svg>

    <i id="inspect_hint">press F to inspect</i>
    <div id="background_wrapper">
        <div id="left_bar">
            <img src="resources/images/cockatoo.webp" alt="cockatoo dancing video" id="cockatoo" class="no-thumb">
        </div>
        <div id="right_bar">
            <img src="resources/images/cat.gif" alt="cat dancing video" id="cat" class="no-thumb">
        </div>
    </div>
    <div class="menu-wrapper">
        <h1>Welcome to crownana bread!</h1>
        <div class="menu">
            <a class="menu-item-container" id="blog-menu" href="blog/index.html">
                <div class="menu-item">
                    <b>BLOG</b>
                </div>
            </a>
            <a class="menu-item-container" id="gallery-menu" href="gallery/all.html">
                <div class="menu-item">
                    <b>GALLERY</b>
                </div>
            </a>
            <a class="menu-item-container" id="about-menu" href="about/index.html">
                <div class="menu-item">
                    <b>ABOUT</b>
                </div>
            </a>
        </div>
    </div>

    <script src="resources/scripts/common.js"></script>
    <script src="resources/scripts/home.js"></script>
    <script src="resources/scripts/autoplay.js"></script>
</body>
</html>
